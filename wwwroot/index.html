<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management Portal</title>

    <link rel="stylesheet"
          href="/css/site.css">
</head>

<body>

    <header>
        <h1>Employee Management Portal</h1>

        <p>
            Manage employee information using ASP.NET Core
            and PostgreSQL
        </p>
    </header>

    <main>

        <section class="form-section">

            <h2 id="formTitle">
                Add Employee
            </h2>

            <form id="employeeForm">

                <input
                    type="hidden"
                    id="employeeId">

                <div class="form-group">

                    <label for="name">
                        Employee Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter employee name"
                        required>

                </div>

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="Enter department"
                        required>

                </div>

                <div class="form-group">

                    <label for="role">
                        Role
                    </label>

                    <input
                        type="text"
                        id="role"
                        placeholder="Enter employee role"
                        required>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required>

                </div>

                <div class="button-group">

                    <button
                        type="submit"
                        id="saveButton">

                        Save Employee

                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                        onclick="cancelEdit()"
                        hidden>

                        Cancel

                    </button>

                </div>

            </form>

            <p id="message"></p>

        </section>


        <section class="table-section">

            <div class="table-header">

                <h2>
                    Employee List
                </h2>

                <button onclick="loadEmployees()">
                    Refresh
                </button>

            </div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Role</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="employeeTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>

        Employee Management Application

    </footer>

    <script src="/js/employee.js"></script>

</body>

</html>
